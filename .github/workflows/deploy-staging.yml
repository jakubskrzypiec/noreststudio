# Test samoobslugi: ta galaz (self-service-test) publikuje na darmowy staging
# GitHub Pages, NIE na serwer klienta. Sluzy wylacznie do sprawdzenia, czy
# przeplyw "wrzuc plik przez GitHub Desktop -> auto przetworzenie -> auto
# publikacja" dziala, zanim damy klientowi cokolwiek do rak.
name: Test samoobslugi (staging)

on:
  push:
    branches: [self-service-test]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Instalacja ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Przetworzenie zdjec i filmow
        run: npm run media

      - name: Build statycznego eksportu
        env:
          NEXT_PUBLIC_BASE_PATH: /noreststudio
          NEXT_PUBLIC_SITE_URL: https://jakubskrzypiec.github.io/noreststudio
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
